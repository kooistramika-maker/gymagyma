<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Workout Tracker</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #141721;
      --card-inner: #1c202e;
      --text: #f1f3f7;
      --muted: #7e8697;
      --accent: #22c55e;
      --border: rgba(255, 255, 255, 0.08);
      --btn: rgba(255, 255, 255, 0.06);
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; 
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body { 
      background: var(--bg); 
      color: var(--text); 
      padding-bottom: 110px; 
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    header { 
      position: sticky; 
      top: 0; 
      background: rgba(9, 10, 15, 0.94); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px);
      padding: 8px 12px; 
      border-bottom: 1px solid var(--border); 
      z-index: 50; 
    }
    .top-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 6px; 
    }
    .brand { font-size: 13px; font-weight: 800; letter-spacing: 0.5px; color: var(--muted); }
    .top-btn { 
      background: var(--btn); 
      border: 1px solid var(--border); 
      color: var(--text); 
      padding: 5px 12px; 
      border-radius: 99px; 
      font-size: 11px; 
      font-weight: 700; 
      cursor: pointer; 
    }
    .nav-row { 
      display: flex; 
      gap: 5px; 
      overflow-x: auto; 
      padding: 2px 0; 
      margin-bottom: 4px; 
    }
    .nav-row::-webkit-scrollbar { display: none; }
    .pill { 
      background: var(--btn); 
      border: 1px solid var(--border); 
      color: var(--muted); 
      padding: 6px 14px; 
      border-radius: 99px; 
      font-size: 12px; 
      font-weight: 700; 
      white-space: nowrap; 
      cursor: pointer; 
    }
    .pill.active { background: #fff; color: #000; border-color: #fff; }
    
    .container { max-width: 580px; margin: 0 auto; padding: 10px; }
    
    .stats-strip { 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      padding: 10px 14px; 
      display: flex; 
      justify-content: space-between; 
      font-size: 12px; 
      color: var(--muted); 
      margin-bottom: 8px; 
    }
    .stats-strip strong { color: var(--text); }
    
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    .action-btn { 
      background: var(--card-inner); 
      border: 1px solid var(--border); 
      color: var(--text); 
      padding: 8px; 
      border-radius: 10px; 
      font-size: 11px; 
      font-weight: 700; 
      cursor: pointer; 
    }
    
    .card { 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 14px; 
      padding: 10px; 
      margin-bottom: 10px; 
    }
    .card-head { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      cursor: pointer; 
      padding: 2px 4px 6px 4px; 
    }
    .card.collapsed .card-body { display: none; }
    .card.collapsed .arrow { transform: rotate(-90deg); }
    .arrow { font-size: 10px; color: var(--muted); transition: 0.2s; }
    
    .row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    input, select { 
      background: var(--card-inner); 
      border: 1px solid var(--border); 
      color: var(--text); 
      border-radius: 8px; 
      padding: 8px; 
      font-size: 13px; 
      font-weight: 600; 
      outline: none; 
    }
    input[type="number"], input.num { text-align: center; }
    
    .set-box { 
      background: var(--card-inner); 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      padding: 8px; 
      margin-top: 6px; 
    }
    .set-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr 1fr 42px; 
      gap: 5px; 
      align-items: center; 
    }
    .lbl { 
      font-size: 9px; 
      font-weight: 800; 
      color: var(--muted); 
      text-align: center; 
      text-transform: uppercase; 
      margin-bottom: 2px; 
    }
    .check { 
      width: 42px; 
      height: 38px; 
      border-radius: 8px; 
      border: 1px solid var(--border); 
      background: var(--btn); 
      color: var(--muted); 
      font-size: 15px; 
      font-weight: 900; 
      cursor: pointer; 
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .check.done { background: var(--accent); color: #000; border-color: var(--accent); }
    
    .rir-box { 
      margin-top: 6px; 
      display: flex; 
      flex-direction: column; 
      gap: 3px; 
      padding-top: 5px; 
      border-top: 1px solid rgba(255,255,255,0.05); 
    }
    .rir-line { display: flex; justify-content: space-between; align-items: center; }
    .rir-title { font-size: 9px; font-weight: 800; color: var(--muted); width: 42px; }
    .rir-btns { display: flex; gap: 2px; flex: 1; justify-content: flex-end; }
    .r-btn { 
      min-width: 27px; 
      height: 25px; 
      border-radius: 5px; 
      border: 1px solid var(--border); 
      background: var(--btn); 
      color: var(--muted); 
      font-size: 11px; 
      font-weight: 700; 
      cursor: pointer; 
    }
    .r-btn.act { background: var(--accent); color: #000; font-weight: 900; }
    
    .footer { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      right: 0; 
      background: rgba(9, 10, 15, 0.96); 
      border-top: 1px solid var(--border); 
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      z-index: 50; 
    }
    .timer-left { display: flex; flex-direction: column; }
    .timer-txt { font-size: 19px; font-weight: 800; letter-spacing: 0.5px; }
    .footer-tools { display: flex; gap: 5px; align-items: center; }
    
    .toast { 
      position: fixed; 
      top: 12px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: #fff; 
      color: #000; 
      padding: 6px 16px; 
      border-radius: 99px; 
      font-size: 11px; 
      font-weight: 800; 
      display: none; 
      z-index: 999; 
    }
    .haptic-trigger { position: absolute; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>
  <input type="checkbox" id="hapticSwitch" class="haptic-trigger">

  <header>
    <div class="top-bar">
      <span class="brand">WORKOUT</span>
      <button class="top-btn" onclick="undo()">↶ Herstel</button>
    </div>
    <div class="nav-row" id="daysNav"></div>
    <div class="nav-row" id="weeksNav"></div>
  </header>

  <div class="container">
    <div class="stats-strip">
      <span>Voltooid: <strong id="statSets">0</strong> sets</span>
      <span>Volume: <strong id="statKg">0 kg</strong></span>
    </div>

    <div class="action-grid">
      <button class="action-btn" onclick="copyDayToAllWeeks()">📋 Dag kopiëren naar W1-8</button>
      <button class="action-btn" onclick="copyWeekToAllWeeks()">📦 Week kopiëren naar W1-8</button>
    </div>

    <div id="exerciseList"></div>

    <button onclick="addExercise()" class="action-btn" style="width:100%; padding:11px; font-size:12px; margin-top:4px;">
      + Oefening Toevoegen
    </button>
  </div>

  <div class="footer">
    <div class="timer-left">
      <span style="font-size:9px; font-weight:800; color:var(--muted);">RUSTTIMER</span>
      <span class="timer-txt" id="timerDisplay">00:00</span>
    </div>
    <div class="footer-tools">
      <select id="soundSelect" onchange="changeSound(this.value)" style="padding:5px 6px; font-size:11px;">
        <option value="beep">Toon: Beep</option>
        <option value="bong">Toon: Bong</option>
        <option value="chime">Toon: Chime</option>
      </select>
      <select id="autoTimer" onchange="setAutoTimer(this.value)" style="padding:5px 6px; font-size:11px;">
        <option value="0">Auto: Uit</option>
        <option value="60">60s</option>
        <option value="90" selected>90s</option>
        <option value="120">2m</option>
      </select>
      <button class="top-btn" onclick="addTimerSec(60)">+60s</button>
      <button class="top-btn" onclick="resetTimer()" style="color:#ef4444;">Stop</button>
    </div>
  </div>

  <script>
    const mem = {};
    const Store = {
      get(k) { try { return localStorage.getItem(k) || mem[k] || null; } catch(e) { return mem[k] || null; } },
      set(k, v) { mem[k] = String(v); try { localStorage.setItem(k, String(v)); } catch(e) {} }
    };

    const MUSCLES = ['Borst', 'Rug', 'Quadriceps', 'Hamstrings/Glutes', 'Schouders', 'Biceps', 'Triceps', 'Kuiten/Buik'];
    const DAYS = ['Dag 1', 'Dag 2', 'Dag 3', 'Dag 4', 'Dag 5'];
    let curWeek = 1;
    let curDay = DAYS[0];
    let appData = {};
    let undoHistory = [];
    let autoSec = parseInt(Store.get('wk_auto_timer') || '90');
    let chosenTone = Store.get('wk_chosen_tone') || 'beep';
    let audioCtx = null;
    let wakeLock = null;

    let timerTargetEnd = null;
    let timerTick = null;

    try { appData = JSON.parse(Store.get('wk_app_data') || '{}'); } catch(e) { appData = {}; }

    function triggerHaptic() {
      try {
        const sw = document.getElementById('hapticSwitch');
        if (sw) sw.checked = !sw.checked;
        if (navigator.vibrate) navigator.vibrate(25);
      } catch (e) {}
    }

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(type = chosenTone) {
      initAudio();
      const now = audioCtx.currentTime;

      if (type === 'beep') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(850, now);
        osc.frequency.setValueAtTime(950, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'bong') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.7);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        osc.start(now);
        osc.stop(now + 0.7);
      } else if (type === 'chime') {
        [523.25, 659.25, 783.99].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          gain.gain.setValueAtTime(0.18, now + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.3);
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 0.3);
        });
      }
    }

    function changeSound(v) {
      chosenTone = v;
      Store.set('wk_chosen_tone', v);
      playTone(v);
    }

    async function requestWake() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch(e) {}
    }
    function releaseWake() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }

    function startTimer(sec) {
      initAudio();
      requestWake();
      timerTargetEnd = Date.now() + (sec * 1000);
      updateTimerUI();
      clearInterval(timerTick);
      timerTick = setInterval(tickTimer, 250);
    }

    function tickTimer() {
      const remaining = Math.max(0, Math.round((timerTargetEnd - Date.now()) / 1000));
      updateTimerUI(remaining);
      if (remaining <= 0) {
        resetTimer();
        playTone();
        triggerHaptic();
      }
    }

    function addTimerSec(sec) {
      if (!timerTargetEnd || Date.now() >= timerTargetEnd) startTimer(sec);
      else {
        timerTargetEnd += (sec * 1000);
        tickTimer();
      }
    }

    function resetTimer() {
      clearInterval(timerTick);
      timerTick = null;
      timerTargetEnd = null;
      releaseWake();
      updateTimerUI(0);
    }

    function updateTimerUI(rem = 0) {
      const m = Math.floor(rem / 60);
      const s = rem % 60;
      document.getElementById('timerDisplay').innerText = 
        `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && timerTargetEnd) tickTimer();
    });

    function getKey(w = curWeek, d = curDay) { return `W${w}_${d}`; }

    function getDayList(w = curWeek, d = curDay) {
      const k = getKey(w, d);
      if (!appData[k]) {
        appData[k] = [{
          name: '', muscle: '',
          sets: [{ plates: '', kg: '', reps: '', targetRir: '2', actualRir: '2', done: false }]
        }];
      }
      return appData[k];
    }

    function save() {
      Store.set('wk_app_data', JSON.stringify(appData));
      updateStats();
    }

    function saveState() {
      undoHistory.push(JSON.stringify(appData));
      if (undoHistory.length > 20) undoHistory.shift();
    }

    function undo() {
      if (!undoHistory.length) { showToast('Niets om te herstellen'); return; }
      appData = JSON.parse(undoHistory.pop());
      save();
      renderAll();
      showToast('Hersteld');
    }

    function showToast(txt) {
      const t = document.getElementById('toast');
      t.innerText = txt;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 1800);
    }

    function setDay(d) { curDay = d; renderNav(); renderExercises(); updateStats(); }
    function setWeek(w) { curWeek = w; renderNav(); renderExercises(); updateStats(); }

    function renderNav() {
      document.getElementById('daysNav').innerHTML = DAYS.map(d =>
        `<button class="pill ${d === curDay ? 'active' : ''}" onclick="setDay('${d}')">${d}</button>`
      ).join('');
      document.getElementById('weeksNav').innerHTML = Array.from({length: 8}, (_, i) => i + 1).map(w =>
        `<button class="pill ${w === curWeek ? 'active' : ''}" onclick="setWeek(${w})">W${w}</button>`
      ).join('');
    }

    function addExercise() {
      saveState();
      getDayList().push({
        name: '', muscle: '',
        sets: [{ plates: '', kg: '', reps: '', targetRir: '2', actualRir: '2', done: false }]
      });
      save();
      renderExercises();
    }

    function delExercise(idx) {
      saveState();
      const list = getDayList();
      if (list.length > 1) {
        list.splice(idx, 1);
        save();
        renderExercises();
      }
    }

    function addSet(exIdx) {
      saveState();
      const ex = getDayList()[exIdx];
      const prev = ex.sets[ex.sets.length - 1] || {};
      ex.sets.push({
        plates: prev.plates || '', kg: prev.kg || '', reps: prev.reps || '',
        targetRir: prev.targetRir || '2', actualRir: prev.targetRir || '2', done: false
      });
      save();
      renderExercises();
    }

    function delSet(exIdx) {
      saveState();
      const ex = getDayList()[exIdx];
      if (ex.sets.length > 1) {
        ex.sets.pop();
        save();
        renderExercises();
      }
    }

    function toggleDone(exIdx, setIdx) {
      initAudio();
      saveState();
      const s = getDayList()[exIdx].sets[setIdx];
      s.done = !s.done;
      save();
      triggerHaptic();
      if (s.done && autoSec > 0) startTimer(autoSec);
      renderExercises();
    }

    function updateKg(exIdx, setIdx, val) {
      const s = getDayList()[exIdx].sets[setIdx];
      s.kg = val;
      const num = parseFloat(val.replace(',', '.'));
      if (!isNaN(num)) s.plates = Math.round((num / 20) * 100) / 100;
      save();
    }

    function updatePlates(exIdx, setIdx, val) {
      const s = getDayList()[exIdx].sets[setIdx];
      s.plates = val;
      const num = parseFloat(val.replace(',', '.'));
      if (!isNaN(num)) s.kg = Math.round(num * 20 * 10) / 10;
      save();
      renderExercises();
    }

    function setRir(exIdx, setIdx, key, val) {
      saveState();
      getDayList()[exIdx].sets[setIdx][key] = String(val);
      save();
      triggerHaptic();
      renderExercises();
    }

    function copyDayToAllWeeks() {
      saveState();
      const src = JSON.stringify(getDayList().map(cleanForCopy));
      for (let w = 1; w <= 8; w++) {
        if (w !== curWeek) appData[getKey(w, curDay)] = JSON.parse(src);
      }
      save();
      showToast(`${curDay} gekopieerd naar alle weken`);
    }

    function copyWeekToAllWeeks() {
      saveState();
      DAYS.forEach(d => {
        const src = JSON.stringify(getDayList(curWeek, d).map(cleanForCopy));
        for (let w = 1; w <= 8; w++) {
          if (w !== curWeek) appData[getKey(w, d)] = JSON.parse(src);
        }
      });
      save();
      showToast(`Week ${curWeek} gekopieerd naar alle weken`);
    }

    function cleanForCopy(ex) {
      return {
        name: ex.name || '', muscle: ex.muscle || '',
        sets: (ex.sets || []).map(s => ({
          plates: '', kg: '', reps: '',
          targetRir: s.targetRir || '2', actualRir: s.targetRir || '2', done: false
        }))
      };
    }

    function updateStats() {
      let count = 0, kg = 0;
      getDayList().forEach(ex => {
        ex.sets.forEach(s => {
          if (s.done) {
            count++;
            kg += (parseFloat(s.kg) || 0) * (parseFloat(s.reps) || 0);
          }
        });
      });
      document.getElementById('statSets').innerText = count;
      document.getElementById('statKg').innerText = Math.round(kg) + ' kg';
    }

    function setAutoTimer(v) { autoSec = parseInt(v); Store.set('wk_auto_timer', v); }

    function renderExercises() {
      const list = getDayList();
      const rirOpts = ['-1', '0', '1', '2', '3', '4'];
      let html = '';

      list.forEach((ex, eIdx) => {
        const allDone = ex.sets.length > 0 && ex.sets.every(s => s.done);
        html += `
          <div class="card">
            <div class="card-head" onclick="this.parentElement.classList.toggle('collapsed')">
              <span style="font-weight:700; font-size:13px;">${ex.name || 'Oefening ' + (eIdx + 1)} ${allDone ? '✓' : ''}</span>
              <span class="arrow">▼</span>
            </div>
            <div class="card-body">
              <div class="row">
                <input type="text" style="flex:1;" placeholder="Naam oefening..." value="${ex.name || ''}"
                  oninput="getDayList()[${eIdx}].name = this.value; save();">
                <button class="top-btn" onclick="delExercise(${eIdx})">✕</button>
              </div>
              <div class="row">
                <select style="width:100%;" onchange="getDayList()[${eIdx}].muscle = this.value; save();">
                  <option value="">Spiergroep...</option>
                  ${MUSCLES.map(m => `<option value="${m}" ${ex.muscle === m ? 'selected' : ''}>${m}</option>`).join('')}
                </select>
              </div>
              <div class="row">
                <button class="top-btn" onclick="addSet(${eIdx})">+ Set</button>
                <button class="top-btn" onclick="delSet(${eIdx})">- Set</button>
              </div>
              ${ex.sets.map((s, sIdx) => `
                <div class="set-box">
                  <div class="set-grid">
                    <div>
                      <div class="lbl">Plates</div>
                      <input type="text" class="num" value="${s.plates || ''}" onchange="updatePlates(${eIdx},${sIdx}, this.value)">
                    </div>
                    <div>
                      <div class="lbl">KG</div>
                      <input type="number" class="num" value="${s.kg || ''}" oninput="updateKg(${eIdx},${sIdx}, this.value)">
                    </div>
                    <div>
                      <div class="lbl">Reps</div>
                      <input type="number" class="num" value="${s.reps || ''}" oninput="getDayList()[${eIdx}].sets[${sIdx}].reps = this.value; save();">
                    </div>
                    <button class="check ${s.done ? 'done' : ''}" onclick="toggleDone(${eIdx},${sIdx})">✓</button>
                  </div>
                  <div class="rir-box">
                    <div class="rir-line">
                      <span class="rir-title">Doel</span>
                      <div class="rir-btns">
                        ${rirOpts.filter(r => r !== '-1').map(r => `
                          <button class="r-btn ${s.targetRir === r ? 'act' : ''}" onclick="setRir(${eIdx}, ${sIdx}, 'targetRir', '${r}')">${r}</button>
                        `).join('')}
                      </div>
                    </div>
                    <div class="rir-line">
                      <span class="rir-title">Behaald</span>
                      <div class="rir-btns">
                        ${rirOpts.map(r => `
                          <button class="r-btn ${s.actualRir === r ? 'act' : ''}" onclick="setRir(${eIdx}, ${sIdx}, 'actualRir', '${r}')">${r === '-1' ? 'Fail' : r}</button>
                        `).join('')}
                      </div>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });

      document.getElementById('exerciseList').innerHTML = html;
      updateStats();
    }

    function renderAll() {
      renderNav();
      renderExercises();
      updateStats();
      document.getElementById('soundSelect').value = chosenTone;
      document.getElementById('autoTimer').value = autoSec;
    }

    renderAll();
  </script>
</body>
</html>
</body>
</html>
